<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Multicell</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <h1>Multicell</h1>
  </header>

  <label class="row">
    <span>Focus highlight</span>
    <input type="checkbox" id="enabled" class="switch">
  </label>

  <label class="row">
    <span>Follow multi-cell selections</span>
    <input type="checkbox" id="followSelection" class="switch">
  </label>

  <div class="group" id="style">
    <label class="row">
      <span>Color</span>
      <input type="color" id="color">
    </label>

    <label class="stack">
      <span class="between"><span>Opacity</span><output id="opacityOut"></output></span>
      <input type="range" id="opacity" min="5" max="90" step="1">
    </label>

    <div class="preview" aria-hidden="true">
      <div class="cells"></div>
      <div class="band row-band"></div>
      <div class="band col-band"></div>
    </div>
  </div>

  <footer>
    <span>Shortcut: <kbd id="shortcut">not set</kbd></span>
    <a href="#" id="editShortcut">Change</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
